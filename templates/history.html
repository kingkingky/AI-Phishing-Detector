<!doctype html>
<html>
<head>
    <title>History</title>
</head>
<body>

<h1>Scan History</h1>

<table border="1">

<tr>
<th>ID</th>
<th>Message</th>
<th>Result</th>
<th>Risk</th>
<th>Date</th>
</tr>

{% for row in data %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[7] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
